name: ci

# The skill's own checks. cerase-core ships a byte-identical copy of SKILL.md in
# its image and compares the copies in its own CI; this repo checks what only a
# repo of its own can: its documents and its history.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads every commit: a secret committed and later
          # removed is still published.
          fetch-depth: 0
      # scripts/docs-parity.sh is cerase-core's, copied here by its
      # scripts/sync-tooling.sh. The pin is what makes the copy a copy.
      - name: Vendored tooling matches the sha it recorded
        run: sha256sum --check scripts/TOOLING.sha256 scripts/TOOLING.seal
      - name: Docs parity — nothing named that does not exist
        run: ./scripts/docs-parity.sh
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan over the whole history
        run: gitleaks detect --source . --redact --verbose --no-banner --exit-code 1
